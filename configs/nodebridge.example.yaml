# NodeBridge 本地智能体网关配置模板
# 复制为 nodebridge.yaml 或运行 `nodebridge init` 自动生成带随机 Token 的配置

server:
  # MCP Streamable HTTP 监听地址（默认仅监听本地回环，严禁未经认证暴露公网）
  mcp_listen: "127.0.0.1:18765"
  # 本地 Web 审批控制台与管理 API 监听地址
  admin_listen: "127.0.0.1:18766"
  # MCP 客户端鉴权 Bearer Token（建议使用 `nodebridge init` 生成高熵随机值）
  mcp_token: "CHANGE_ME_MCP_TOKEN"
  # 本地管理控制台与 CLI 鉴权 Token
  admin_token: "CHANGE_ME_ADMIN_TOKEN"
  # 允许的 HTTP Origin 列表（为空时仅允许无 Origin 的原生客户端或同源本地回环）
  allowed_origins:
    - "http://127.0.0.1:18766"
    - "http://localhost:18766"

storage:
  # 本地持久化目录（任务快照、审计日志）
  data_dir: "./data"
  # 单审计日志文件轮转上限（MB）
  audit_max_size_mb: 10
  # 审计日志保留历史文件个数
  audit_max_backups: 10

approval:
  # 本地直连审批等待超时（秒）。0 表示一直等待用户批准或拒绝，直到客户端取消或触发急停
  timeout_seconds: 0
  # L1 限时批量授权允许的最大时长（分钟）
  max_grant_minutes: 60
  # 远程调用同步等待审批和执行的总时长（秒），到期后可用 approval.status 查询
  remote_wait_seconds: 45
  # 远程异步续接审批单在本地控制台保留的最长秒数
  pending_ttl_seconds: 900
  # 远程重复请求指纹幂等去重窗口（秒）
  idempotency_ttl_seconds: 300

tasks:
  # 最大并发运行任务数
  max_concurrent: 4
  # 默认单任务超时（秒）
  default_timeout_seconds: 300
  # 最大允许单任务超时（秒）
  max_timeout_seconds: 1800
  # 单任务 stdout/stderr 各自保留的最大字节数（防日志打爆内存）
  max_output_bytes: 1048576

security:
  # 是否默认开启全部权限模式（免除审批并放开常规命令限制；SSH 私钥与密钥目录等硬红线仍始终禁止 CRUD）
  full_permissions: false
  # 是否默认开启全部目录模式（允许访问宿主机任意普通目录；SSH/GPG/AWS 等密钥目录仍强制隐藏与拦截）
  allow_all_dirs: false
  # 始终禁止读取/搜索/写入的敏感路径通配符（不可被全部权限或工作区降级覆盖）
  global_deny_globs:
    - "**/.env"
    - "**/.env.*"
    - "**/*.pem"
    - "**/*.key"
    - "**/*.ppk"
    - "**/*.p12"
    - "**/*.pfx"
    - "**/*.jks"
    - "**/*.keystore"
    - "**/*.kdbx"
    - "**/id_rsa*"
    - "**/id_ed25519*"
    - "**/id_ecdsa*"
    - "**/id_dsa*"
    - "**/authorized_keys"
    - "**/.ssh"
    - "**/.ssh/**"
    - "**/.aws"
    - "**/.aws/**"
    - "**/.gnupg"
    - "**/.gnupg/**"
    - "**/.kube"
    - "**/.kube/**"
    - "**/.docker/config.json"
    - "**/.netrc"
    - "**/_netrc"
    - "**/.git-credentials"
    - "**/.npmrc"
    - "**/.pypirc"
    - "**/credentials.json"
    - "**/*secret*"
    - "**/nodebridge.yaml"
  # 命令执行分层白名单策略
  command_policy:
    # 是否允许通过显式 use_shell=true 调用系统 Shell（即使开启也强制 L2/L3 审批）
    allow_explicit_shell: true
    # L0 只读可执行命令规则（免审批，仅当参数匹配时生效）
    l0_rules:
      - executable: "git"
        allowed_subcommands: ["status", "diff", "log", "branch", "rev-parse", "show"]
      - executable: "go"
        allowed_subcommands: ["version", "env", "list"]
      - executable: "node"
        allowed_subcommands: ["--version", "-v"]
      - executable: "rustc"
        allowed_subcommands: ["--version"]
    # L1 普通开发测试命令规则（默认需审批，支持按工作区限时批量授权；依赖安装类命令仍保留在 L2）
    l1_rules:
      - executable: "go"
        allowed_subcommands: ["test", "vet", "build", "fmt", "mod"]
      - executable: "npm"
        allowed_subcommands: ["test", "run"]
      - executable: "pnpm"
        allowed_subcommands: ["test", "run"]
      - executable: "yarn"
        allowed_subcommands: ["test", "run"]
      - executable: "bun"
        allowed_subcommands: ["test", "run", "build"]
      - executable: "node"
        allowed_subcommands: ["--check"]
      - executable: "tsc"
        allowed_subcommands: []
      - executable: "eslint"
        allowed_subcommands: []
      - executable: "prettier"
        allowed_subcommands: []
      - executable: "pytest"
        allowed_subcommands: []
      - executable: "ruff"
        allowed_subcommands: ["check", "format"]
      - executable: "python"
        allowed_subcommands: ["-m"]
      - executable: "python3"
        allowed_subcommands: ["-m"]
      - executable: "cargo"
        allowed_subcommands: ["test", "check", "build", "clippy", "fmt"]
      - executable: "make"
        allowed_subcommands: []
      - executable: "cmake"
        allowed_subcommands: ["--build", "--version"]
      - executable: "mvn"
        allowed_subcommands: ["test", "compile", "verify", "package"]
      - executable: "gradle"
        allowed_subcommands: ["test", "check", "build", "assemble"]
      - executable: "dotnet"
        allowed_subcommands: ["test", "build", "format"]
    # L2 高风险命令（强制每次人工审批，不享受限时批量授权）
    l2_executables:
      - "npm"
      - "pnpm"
      - "yarn"
      - "bun"
      - "pip"
      - "pip3"
      - "curl"
      - "wget"
      - "rm"
      - "del"
    # L3 硬拒绝可执行程序（默认直接拒绝，防提权与系统破坏）
    hard_deny_executables:
      - "sudo"
      - "su"
      - "runas"
      - "gsudo"
      - "shutdown"
      - "reboot"
      - "diskpart"
      - "format"
      - "mkfs"
      - "reg"
      - "regedit"
      - "netsh"
      - "iptables"
      - "ufw"
      - "sc"
      - "schtasks"

workspaces:
  - id: "default"
    # 请修改为您要授权的本地项目根目录绝对路径
    root: "."
    read_only: false
    deny_globs: []

# 阶段二：远程安全隧道 / 外部 HTTPS 反代配置
relay:
  # 可选值：disabled | cloudflared_quick | cloudflared_named | external
  mode: "disabled"
  # 固定公网 HTTPS 基地址（cloudflared_named / external 必填；cloudflared_quick 自动发现）
  public_url: ""
  # Cloudflare Named Tunnel Token（推荐使用 "env:CLOUDFLARE_TUNNEL_TOKEN" 从环境变量读取）
  tunnel_token: ""
  # 自定义本机 cloudflared 可执行路径（留空则自动从 PATH 探测）
  cloudflared_bin: ""
  # 触发 Kill All 一键急停时是否同时自动断开公网隧道
  kill_all_disconnect_tunnel: false
  # 设备唯一 ID（留空则首次启动自动生成并持久化至 data_dir/device.json）
  device_id: ""

# 阶段二：内置单用户 OAuth 2.1 授权服务器配置（兼容 Gemini / ChatGPT / Claude Web 远程 MCP）
oauth:
  # 当 relay.mode != disabled 时默认自动开启
  enabled: false
  # 短期 Access Token 有效期（秒，默认 1 小时）
  access_token_ttl_seconds: 3600
  # 可轮换 Refresh Token 有效期（秒，默认 7 天）
  refresh_token_ttl_seconds: 604800
  # 一次性配对码有效期（秒，默认 5 分钟）
  pairing_code_ttl_seconds: 300
  # 允许符合 RFC 7591 的动态客户端注册（DCR）。设为 false 可关闭新客户端注册。
  allow_dynamic_registration: true
  # 公网 OAuth 接口按来源 IP 每分钟请求速率上限
  rate_limit_per_minute: 20

# 长期稳定使用（固定域名模式）：开机自启动与系统守护进程配置
service:
  # 固定域名模式（cloudflared_named / external）下运行 `nodebridge daemon` 时，自动注册开机自启并交接给系统守护进程后台运行
  auto_register: true
  # 注册到操作系统的服务/任务名称（默认 nodebridge）
  name: "nodebridge"
  # 作用域：auto（默认，管理员自动装系统级服务支持未登录自启，普通用户免提权装用户级无黑框守护）| user | system
  scope: "auto"
  # 后台守护进程日志路径（留空默认写入 <data_dir>/logs/daemon.log）
  log_file: ""
  # 守护进程单日志文件轮转上限（MB）
  log_max_size_mb: 10
  # 守护进程日志保留的历史份数
  log_max_backups: 5
